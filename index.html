<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Core Incremental Simulator</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <canvas id="gameCanvas"></canvas>

  <header id="hud">
    <div id="energyText">Energy: 0</div>
    <div id="rateText">+0 / det</div>
  </header>

  <section id="upgrades">
    <button id="btnPower" type="button">
      <span>Tap Power (Lv.<strong id="powerLv">1</strong>)</span>
      <span id="powerCost">Cost: 10</span>
    </button>
    <button id="btnAuto" type="button">
      <span>Auto Core (Lv.<strong id="autoLv">0</strong>)</span>
      <span id="autoCost">Cost: 25</span>
    </button>
  </section>

  <script type="module" src="main.js"></script>
</body>
</html>
